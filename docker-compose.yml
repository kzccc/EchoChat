services:
  mysql:
    image: mysql:8.0.39
    container_name: echochat-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: echochat
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: echochat-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka:
    image: quay.io/strimzi/kafka:0.41.0-kafka-3.7.0
    container_name: echochat-kafka
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /tmp/kafka-logs
        cat > /tmp/kraft-server.properties <<'EOF'
        process.roles=broker,controller
        node.id=1
        controller.quorum.voters=1@kafka:9093
        listeners=INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
        advertised.listeners=INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:9092
        listener.security.protocol.map=INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
        inter.broker.listener.name=INTERNAL
        controller.listener.names=CONTROLLER
        log.dirs=/tmp/kraft-combined-logs
        num.partitions=6
        offsets.topic.replication.factor=1
        transaction.state.log.replication.factor=1
        transaction.state.log.min.isr=1
        auto.create.topics.enable=false
        EOF
        /opt/kafka/bin/kafka-storage.sh format -t MkU3OEVBNTcwNTJENDM2Qk -c /tmp/kraft-server.properties --ignore-formatted
        exec /opt/kafka/bin/kafka-server-start.sh /tmp/kraft-server.properties
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      LOG_DIR: "/tmp/kafka-logs"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30

  echochat-server:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: echochat-server
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ECHOCHAT_CONFIG: /app/configs/config_docker.toml
      TZ: Asia/Shanghai
    ports:
      - "10000:10000"
    volumes:
      - static-data:/app/static
      - server-logs:/app/logs

  echochat-web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: echochat-web
    depends_on:
      - echochat-server
    ports:
      - "8080:80"
    volumes:
      - static-data:/app/static:ro

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  static-data:
  server-logs:
